name: Perbarui prakiraan

on:
  schedule:
    # Tanggal 6-8 tiap bulan, 14:00 UTC (22:00 WITA). SEAS5 di Open-Meteo diperbarui tanggal 5.
    # Skrip melewati run jika data bulan itu sudah ada, jadi aman dijalankan 3 hari berturut-turut.
    - cron: "0 14 6-8 * *"
  workflow_dispatch:   # tombol "Run workflow" untuk uji manual

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pasang dependensi
        run: pip install requests numpy

      - name: Unduh dan hitung prakiraan
        run: python scripts/update_forecast.py

      - name: Commit hasil
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Perbarui prakiraan $(date -u +%F)" && git push)
