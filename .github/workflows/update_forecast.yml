name: Perbarui prakiraan

on:
  schedule:
    # Tanggal 11-13 tiap bulan, 14:00 UTC (22:00 WITA). C3S merilis sekitar tanggal 10.
    # Jika data belum terbit, run gagal dan dicoba lagi keesokan harinya.
    - cron: "0 14 11-13 * *"
  workflow_dispatch:   # tombol "Run workflow" untuk uji manual

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pasang dependensi
        run: pip install cdsapi xarray cfgrib eccodes numpy

      - name: Unduh dan hitung prakiraan
        run: python scripts/update_forecast.py
        env:
          CDSAPI_URL: https://cds.climate.copernicus.eu/api
          CDSAPI_KEY: ${{ secrets.CDSAPI_KEY }}

      - name: Commit hasil
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Perbarui prakiraan $(date -u +%F)" && git push)
